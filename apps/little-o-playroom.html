<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little O Playroom</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans", "DejaVu Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: #082859;
      background: linear-gradient(#a9e4ff 0 56%, #9bd76c 56%); }
    header { height: 96px; display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: #fff9; backdrop-filter: blur(10px); }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 54px); }
    button, label.button { min-width: 90px; min-height: 62px; border: 3px solid #cbbba8;
      border-radius: 22px; padding: 12px 22px; color: #082859; background: #fff9ee;
      box-shadow: 0 6px 0 #a99378; font-size: 23px; font-weight: 800; cursor: pointer; }
    button:hover, label.button:hover { background: #fff; }
    button:active, label.button:active { transform: translateY(4px); box-shadow: 0 2px 0 #a99378; }
    button:focus-visible, label.button:focus-within, audio:focus-visible { outline: 7px solid #082859; outline-offset: 4px; }
    main { height: calc(100vh - 96px); display: grid; place-items: center; padding: 22px; }
    .panel { width: min(1000px, 95vw); text-align: center; }
    .big { color: #fff; font-size: clamp(120px, 30vw, 340px); font-weight: 900;
      line-height: .95; text-shadow: 0 8px 0 #735b91; user-select: none; }
    .prompt { margin: 12px; font-size: clamp(28px, 5vw, 58px); font-weight: 900; }
    .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
    .choices button { min-width: 150px; background: #fff8db; font-size: clamp(38px, 7vw, 76px); }
    canvas { width: min(1100px, 94vw); height: calc(100vh - 225px); border: 10px solid #fff8db;
      border-radius: 28px; background: #fff; box-shadow: 0 12px 30px #37572955;
      cursor: crosshair; touch-action: none; }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 16px; }
    .color { min-width: 64px; width: 64px; height: 64px; padding: 0; border: 7px solid #fff; border-radius: 50%; }
    .color[aria-pressed="true"] { outline: 7px solid #082859; outline-offset: 2px; }
    .music-box { padding: 42px; border: 5px solid #d8b98b; border-radius: 32px;
      background: #fff8db; box-shadow: 0 12px 30px #37572955; }
    .music-mark { margin-bottom: 28px; font-size: clamp(40px, 8vw, 88px); font-weight: 900; }
    audio { width: min(760px, 85vw); height: 72px; margin-top: 30px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .status { min-height: 54px; margin-top: 18px; font-size: clamp(24px, 3vw, 32px); font-weight: 800; }
    .player-controls { display: flex; justify-content: center; gap: 18px; margin-top: 20px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header><h1 id="title">Little O</h1><button id="home" type="button">Home</button></header>
  <main id="app"></main>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'letters';
    const app = document.querySelector('#app');
    const title = document.querySelector('#title');
    document.querySelector('#home').addEventListener('click', () => window.close());

    const speak = text => {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = .82;
      utterance.pitch = 1.1;
      speechSynthesis.speak(utterance);
    };

    function shuffled(values) {
      const copy = [...values];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swap]] = [copy[swap], copy[index]];
      }
      return copy;
    }

    function game(kind) {
      title.textContent = kind === 'letters' ? 'Letters' : 'Numbers';
      const values = kind === 'letters' ? [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'] : [...Array(10).keys()].map(String);
      let answer;
      function round() {
        answer = values[Math.floor(Math.random() * values.length)];
        const others = shuffled(values.filter(value => value !== answer)).slice(0, 2);
        const choices = shuffled([answer, ...others]);
        app.innerHTML = `<section class="panel"><div class="prompt">Can you find…</div>
          <div class="big" aria-hidden="true">${answer}</div>
          <div class="choices" aria-label="Choices">${choices.map(value => `<button type="button" data-value="${value}" aria-label="${kind === 'letters' ? 'Letter' : 'Number'} ${value}">${value}</button>`).join('')}</div>
          <div class="status" role="status" aria-live="polite"></div></section>`;
        speak(kind === 'letters' ? `Can you find the letter ${answer}?` : `Can you find the number ${answer}?`);
        app.querySelectorAll('[data-value]').forEach(button => button.addEventListener('click', () => {
          const status = app.querySelector('.status');
          if (button.dataset.value === answer) {
            status.textContent = 'You found it!';
            speak('You found it!');
            setTimeout(round, 900);
          } else {
            status.textContent = 'Try another one.';
            speak('Try another one.');
          }
        }));
        app.querySelector('[data-value]').focus();
      }
      round();
    }

    function draw() {
      title.textContent = 'Draw';
      const colors = [
        ['#ef5350', 'red'], ['#ffb300', 'gold'], ['#43a047', 'green'],
        ['#1e88e5', 'blue'], ['#8e24aa', 'purple'], ['#4e342e', 'brown']
      ];
      app.innerHTML = `<section><div class="tools">
        <button id="clear" type="button">Clear</button>
        ${colors.map(([color, name], index) => `<button class="color" type="button" style="background:${color}" data-color="${color}" aria-label="Use ${name}" aria-pressed="${index === 3}"></button>`).join('')}
        <button id="save" type="button">Save picture</button></div>
        <canvas id="paper" aria-label="Drawing canvas"></canvas>
        <div class="status" role="status" aria-live="polite"></div></section>`;
      const canvas = document.querySelector('#paper');
      const context = canvas.getContext('2d');
      const status = app.querySelector('.status');
      let color = '#1e88e5';
      let drawing = false;

      function sizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const previous = document.createElement('canvas');
        previous.width = canvas.width;
        previous.height = canvas.height;
        previous.getContext('2d').drawImage(canvas, 0, 0);
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(bounds.width * ratio));
        canvas.height = Math.max(1, Math.round(bounds.height * ratio));
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (previous.width) context.drawImage(previous, 0, 0, previous.width, previous.height, 0, 0, bounds.width, bounds.height);
        context.lineCap = 'round';
        context.lineJoin = 'round';
        context.lineWidth = 12;
      }

      const point = event => {
        const bounds = canvas.getBoundingClientRect();
        return [event.clientX - bounds.left, event.clientY - bounds.top];
      };
      sizeCanvas();
      addEventListener('resize', sizeCanvas);
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        drawing = true;
        context.beginPath();
        context.moveTo(...point(event));
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (!drawing) return;
        event.preventDefault();
        context.strokeStyle = color;
        context.lineTo(...point(event));
        context.stroke();
      });
      canvas.addEventListener('pointerup', () => { drawing = false; });
      canvas.addEventListener('pointercancel', () => { drawing = false; });
      document.querySelectorAll('[data-color]').forEach(button => button.addEventListener('click', () => {
        color = button.dataset.color;
        document.querySelectorAll('[data-color]').forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
      }));
      document.querySelector('#clear').addEventListener('click', () => {
        context.save();
        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.restore();
        status.textContent = 'Fresh page.';
      });
      document.querySelector('#save').addEventListener('click', () => {
        canvas.toBlob(blob => {
          const link = document.createElement('a');
          link.download = `Carl-drawing-${Date.now()}.png`;
          link.href = URL.createObjectURL(blob);
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          status.textContent = 'Your picture is saved in My Things.';
          speak('Your picture is saved in My Things.');
        }, 'image/png');
      });
    }

    function music() {
      title.textContent = 'Music';
      app.innerHTML = `<section class="music-box panel"><div class="music-mark">Music</div>
        <label class="button" for="songs">Choose songs</label>
        <input id="songs" type="file" accept="audio/*" multiple>
        <div class="status" role="status" aria-live="polite">Ask a grown-up to choose songs from the Little O music folder.</div>
        <audio controls autoplay></audio>
        <div class="player-controls"><button id="back" type="button">Previous</button><button id="next" type="button">Next</button></div></section>`;
      const input = document.querySelector('#songs');
      const audio = document.querySelector('audio');
      const status = document.querySelector('.status');
      let songs = [];
      let index = 0;
      const play = () => {
        if (!songs.length) return;
        audio.src = URL.createObjectURL(songs[index]);
        status.textContent = songs[index].name;
        audio.play().catch(() => {});
      };
      input.addEventListener('change', () => { songs = [...input.files]; index = 0; play(); });
      document.querySelector('#next').addEventListener('click', () => { if (songs.length) { index = (index + 1) % songs.length; play(); } });
      document.querySelector('#back').addEventListener('click', () => { if (songs.length) { index = (index - 1 + songs.length) % songs.length; play(); } });
      audio.addEventListener('ended', () => document.querySelector('#next').click());
    }

    if (mode === 'draw') draw();
    else if (mode === 'music') music();
    else game(mode);
  </script>
</body>
</html>
