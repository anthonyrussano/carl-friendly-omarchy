<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Little O Playroom</title>
  <style>
    :root { color-scheme: light; font-family: "Nunito", "DejaVu Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: #40362f;
      background: linear-gradient(#a9e4ff 0 56%, #9bd76c 56%); }
    header { height: 92px; display:flex; align-items:center; justify-content:space-between;
      padding: 14px 28px; background:#fff9; backdrop-filter:blur(10px); }
    h1 { margin:0; font-size:clamp(30px,5vw,54px); }
    button, label.button { border:0; border-radius:24px; padding:14px 24px; font-size:24px;
      font-weight:800; color:#40362f; background:#fff; box-shadow:0 6px 0 #cbbba8; cursor:pointer; }
    button:active, label.button:active { transform:translateY(4px); box-shadow:0 2px 0 #cbbba8; }
    main { height:calc(100vh - 92px); display:grid; place-items:center; padding:24px; }
    .panel { width:min(1000px,95vw); text-align:center; }
    .big { font-size:clamp(120px,30vw,340px); line-height:.95; font-weight:900; color:#fff;
      text-shadow:0 8px 0 #735b91; user-select:none; }
    .prompt { font-size:clamp(28px,5vw,60px); font-weight:900; margin:15px; }
    .choices { display:flex; flex-wrap:wrap; justify-content:center; gap:22px; }
    .choices button { min-width:150px; font-size:clamp(38px,7vw,76px); background:#fff8db; }
    canvas { background:#fff; border:12px solid #fff8db; border-radius:28px; width:min(1100px,94vw);
      height:calc(100vh - 210px); touch-action:none; box-shadow:0 12px 30px #37572955; }
    .tools { display:flex; gap:12px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
    .color { width:64px; height:64px; padding:0; border:7px solid white; border-radius:50%; }
    .music-box { background:#fff8db; border-radius:32px; padding:42px; box-shadow:0 12px 30px #37572955; }
    audio { width:min(760px,85vw); margin-top:30px; height:72px; }
    input[type=file] { display:none; }
    .status { min-height:60px; font-size:32px; font-weight:800; margin-top:18px; }
  </style>
</head>
<body>
  <header><h1 id="title">Little O</h1><button onclick="window.close()">🏠 Home</button></header>
  <main id="app"></main>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'letters';
    const app = document.querySelector('#app');
    const title = document.querySelector('#title');
    const speak = text => { speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; u.pitch=1.1; speechSynthesis.speak(u); };
    function game(kind) {
      title.textContent = kind === 'letters' ? 'Letters' : 'Numbers';
      const values = kind === 'letters' ? [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'] : [...Array(10).keys()].map(String);
      let answer;
      function round() {
        answer = values[Math.floor(Math.random()*values.length)];
        const others = values.filter(x=>x!==answer).sort(()=>Math.random()-.5).slice(0,2);
        const choices=[answer,...others].sort(()=>Math.random()-.5);
        app.innerHTML=`<section class="panel"><div class="prompt">Can you find…</div><div class="big">${answer}</div><div class="choices">${choices.map(x=>`<button data-value="${x}">${x}</button>`).join('')}</div><div class="status"></div></section>`;
        speak(kind === 'letters' ? `Can you find the letter ${answer}?` : `Can you find the number ${answer}?`);
        app.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{
          if(b.dataset.value===answer){ app.querySelector('.status').textContent='⭐ Great job!'; speak('Great job!'); setTimeout(round,900); }
          else { app.querySelector('.status').textContent='Try again!'; speak('Try again'); }
        });
      }
      round();
    }
    function draw() {
      title.textContent='Draw';
      app.innerHTML=`<section><div class="tools"><button onclick="clearCanvas()">🧽 Clear</button>${['#ef5350','#ffb300','#43a047','#1e88e5','#8e24aa','#4e342e'].map(c=>`<button class="color" style="background:${c}" data-color="${c}"></button>`).join('')}<button onclick="saveCanvas()">💾 Save</button></div><canvas id="paper"></canvas></section>`;
      const c=document.querySelector('#paper'), ctx=c.getContext('2d'); let color='#1e88e5', down=false;
      function size(){const r=c.getBoundingClientRect(); const old=document.createElement('canvas'); old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=12;}
      size(); addEventListener('resize',size);
      const point=e=>{const r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return [p.clientX-r.left,p.clientY-r.top]};
      c.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(...point(e));c.setPointerCapture(e.pointerId)};
      c.onpointermove=e=>{if(!down)return;ctx.strokeStyle=color;ctx.lineTo(...point(e));ctx.stroke()}; c.onpointerup=()=>down=false;
      document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color=b.dataset.color);
      window.clearCanvas=()=>ctx.clearRect(0,0,c.width,c.height);
      window.saveCanvas=()=>{const a=document.createElement('a');a.download=`Carl-drawing-${Date.now()}.png`;a.href=c.toDataURL();a.click();speak('Your picture is saved')};
    }
    function music() {
      title.textContent='Music';
      app.innerHTML=`<section class="music-box panel"><div class="big" style="font-size:180px">🎵</div><label class="button" for="songs">Choose Songs</label><input id="songs" type="file" accept="audio/*" multiple><div class="status">Pick songs from Carl’s music folder.</div><audio controls autoplay></audio><div><button id="back">⏮</button> <button id="next">⏭</button></div></section>`;
      const input=document.querySelector('#songs'),audio=document.querySelector('audio'),status=document.querySelector('.status'); let list=[],i=0;
      const play=()=>{if(!list.length)return;audio.src=URL.createObjectURL(list[i]);status.textContent=list[i].name;audio.play()};
      input.onchange=()=>{list=[...input.files];i=0;play()}; document.querySelector('#next').onclick=()=>{if(list.length){i=(i+1)%list.length;play()}}; document.querySelector('#back').onclick=()=>{if(list.length){i=(i-1+list.length)%list.length;play()}}; audio.onended=()=>document.querySelector('#next').click();
    }
    if(mode==='draw') draw(); else if(mode==='music') music(); else game(mode);
  </script>
</body>
</html>
